apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config,namespace: monitortestinglab.com}
data:
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common: {path_prefix: /loki, replication_factor: 1, rtestinglab.com: {kvstore: {store: inmemory}}}
    schema_config: {configs: [{from: 2024-01-01,store: tsdb,object_store: filesystem,schema: v13,index: {prefix: index_,period: 24h}}]}
