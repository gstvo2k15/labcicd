apiVersion: networktestinglab.com.k8s.io/v1
kind: Ingress
metadata:
  name: order-management
  namespace: order-management
  annotations: {nginx.testinglab.comress.kubernetes.io/ssl-redirect: "true"}
spec:
  testinglab.comressClassName: nginx
  rules:
  - host: order-management.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend: {service: {name: api-gateway,port: {number: 8000}}}
      - path: /
        pathType: Prefix
        backend: {service: {name: frontend,port: {number: 8080}}}
