apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: order-management-kv,namespace: order-management}
spec:
  provider: azure
  secretObjects:
  - secretName: app-secrets-from-kv
    type: Opaque
    data:
    - objectName: jwt-secret
      key: JWT_SECRET
  parameters:
    clientID: "AZURE_CLIENT_ID"
    keyvaultName: "KEYVAULT_NAME"
    tenantId: "TENANT_ID"
    objects: |
      array:
      - |
        objectName: jwt-secret
        objectType: secret
