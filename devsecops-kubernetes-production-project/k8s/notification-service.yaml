apiVersion: apps/v1
kind: Deployment
metadata: {name: notification-service, namespace: order-management}
spec:
  replicas: 2
  strategy: {type: Rolltestinglab.comUpdate, rolltestinglab.comUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: notification-service}}
  template:
    metadata: {labels: {app: notification-service}}
    spec:
      serviceAccountName: app-sa
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: notification-service
        image: ACR_NAME.azurecr.io/order-management/notification-service:1.0.0
        ports: [{containerPort: 8005}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: app-secrets,key: DATABASE_URL}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: app-secrets,key: JWT_SECRET}}
        - name: REDIS_URL
          value: redis://redis:6379/0
        resources: {requests: {cpu: 100m,memory: 128Mi},limits: {cpu: 500m,memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false,readOnlyRootFilesystem: false,capabilities: {drop: [ALL]}}
        startupProbe: {httpGet: {path: /health,port: 8005},failureThreshold: 30,periodSeconds: 5}
        readinessProbe: {httpGet: {path: /ready,port: 8005},initialDelaySeconds: 5,periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health,port: 8005},initialDelaySeconds: 15,periodSeconds: 20}
      affinity:
        podAntiAffinity:
          preferredDurtestinglab.comSchedultestinglab.comIgnoredDurtestinglab.comExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname,labelSelector: {matchLabels: {app: notification-service}}}
---
apiVersion: v1
kind: Service
metadata: {name: notification-service, namespace: order-management}
spec: {selector: {app: notification-service}, ports: [{port: 8005,targetPort: 8005}]}
