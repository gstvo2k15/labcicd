apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: app-read-config, namespace: order-management}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["order-management-config"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBindtestinglab.com
metadata: {name: app-read-config, namespace: order-management}
subjects: [{kind: ServiceAccount,name: app-sa,namespace: order-management}]
roleRef: {kind: Role,name: app-read-config,apiGroup: rbac.authorization.k8s.io}
