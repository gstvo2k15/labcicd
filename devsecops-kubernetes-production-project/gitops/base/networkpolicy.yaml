apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: order-management}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-frontend-ingress, namespace: order-management}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress, Egress]
  ingress:
  - ports: [{protocol: TCP, port: 8080}]
  egress:
  - to: [{podSelector: {matchLabels: {app: api-gateway}}}]
    ports: [{protocol: TCP, port: 8000}]
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
    ports: [{protocol: UDP, port: 53},{protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-gateway, namespace: order-management}
spec:
  podSelector: {matchLabels: {app: api-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
  - ports: [{protocol: TCP, port: 8000}]
  egress:
  - to:
    - {podSelector: {matchLabels: {app: user-service}}}
    - {podSelector: {matchLabels: {app: restaurant-service}}}
    - {podSelector: {matchLabels: {app: order-service}}}
    - {podSelector: {matchLabels: {app: payment-service}}}
    - {podSelector: {matchLabels: {app: notification-service}}}
    ports: [{protocol: TCP, port: 8001},{protocol: TCP, port: 8002},{protocol: TCP, port: 8003},{protocol: TCP, port: 8004},{protocol: TCP, port: 8005}]
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
    ports: [{protocol: UDP, port: 53},{protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-microservice-traffic, namespace: order-management}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [user-service,restaurant-service,order-service,payment-service,notification-service]}]
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: api-gateway}}}]
    ports: [{protocol: TCP, port: 8001},{protocol: TCP, port: 8002},{protocol: TCP, port: 8003},{protocol: TCP, port: 8004},{protocol: TCP, port: 8005}]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{protocol: TCP, port: 5432}]
  - to: [{podSelector: {matchLabels: {app: redis}}}]
    ports: [{protocol: TCP, port: 6379}]
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
    ports: [{protocol: UDP, port: 53},{protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-data-ingress, namespace: order-management}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [postgres,redis]}]
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchExpressions: [{key: app, operator: In, values: [user-service,restaurant-service,order-service,payment-service,notification-service]}]}}]
    ports: [{protocol: TCP, port: 5432},{protocol: TCP, port: 6379}]
