apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: order-management}
spec:
  replicas: 2
  strategy: {type: Rolltestinglab.comUpdate,rolltestinglab.comUpdate: {maxUnavailable: 0,maxSurge: 1}}
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      serviceAccountName: app-sa
      securityContext: {runAsNonRoot: true,seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: frontend
        image: ACR_NAME.azurecr.io/order-management/frontend:1.0.0
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 50m,memory: 64Mi},limits: {cpu: 250m,memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false,readOnlyRootFilesystem: false,capabilities: {drop: [ALL]}}
        startupProbe: {httpGet: {path: /,port: 8080},failureThreshold: 30,periodSeconds: 5}
        readinessProbe: {httpGet: {path: /,port: 8080},periodSeconds: 10}
        livenessProbe: {httpGet: {path: /,port: 8080},periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: order-management}
spec: {selector: {app: frontend},ports: [{port: 8080,targetPort: 8080}]}
