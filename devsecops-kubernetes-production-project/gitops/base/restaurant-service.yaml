apiVersion: apps/v1
kind: Deployment
metadata: {name: restaurant-service, namespace: order-management}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: restaurant-service}}
  template:
    metadata: {labels: {app: restaurant-service}}
    spec:
      serviceAccountName: app-sa
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: restaurant-service
        image: ACR_NAME.azurecr.io/order-management/restaurant-service:1.0.0
        ports: [{containerPort: 8002}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: app-secrets,key: DATABASE_URL}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: app-secrets,key: JWT_SECRET}}
        - name: REDIS_URL
          value: redis://redis:6379/0
        resources: {requests: {cpu: 100m,memory: 128Mi},limits: {cpu: 500m,memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false,readOnlyRootFilesystem: false,capabilities: {drop: [ALL]}}
        startupProbe: {httpGet: {path: /health,port: 8002},failureThreshold: 30,periodSeconds: 5}
        readinessProbe: {httpGet: {path: /ready,port: 8002},initialDelaySeconds: 5,periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health,port: 8002},initialDelaySeconds: 15,periodSeconds: 20}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname,labelSelector: {matchLabels: {app: restaurant-service}}}
---
apiVersion: v1
kind: Service
metadata: {name: restaurant-service, namespace: order-management}
spec: {selector: {app: restaurant-service}, ports: [{port: 8002,targetPort: 8002}]}
