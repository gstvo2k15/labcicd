apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: order-management-hpa, namespace: order-management}
spec:
  scaleTargetRef: {apiVersion: apps/v1,kind: Deployment,name: api-gateway}
  minReplicas: 2
  maxReplicas: 8
  behavior: {scaleUp: {stabilizationWindowSeconds: 0},scaleDown: {stabilizationWindowSeconds: 300}}
  metrics: [{type: Resource,resource: {name: cpu,target: {type: Utilization,averageUtilization: 70}}}]
