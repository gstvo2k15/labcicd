apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: order-management}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: order-management}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB,value: orders}
        - {name: POSTGRES_USER,value: orders}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-secret,key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 5432}]
        resources: {requests: {cpu: 100m,memory: 256Mi},limits: {cpu: 500m,memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false,capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: data,mountPath: /var/lib/postgresql/data}
        - {name: init,mountPath: /docker-entrypoint-initdb.d,readOnly: true}
        readinessProbe: {exec: {command: ["pg_isready","-U","orders","-d","orders"]},initialDelaySeconds: 10,periodSeconds: 10}
      volumes:
      - {name: data,persistentVolumeClaim: {claimName: postgres-data}}
      - {name: init,configMap: {name: postgres-init}}
---
apiVersion: v1
kind: Secret
metadata: {name: postgres-secret, namespace: order-management}
type: Opaque
stringData: {POSTGRES_PASSWORD: CHANGE_ME}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: order-management}
spec: {selector: {app: postgres}, ports: [{port: 5432,targetPort: 5432}]}
