apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: order-management-production,namespace: argocd}
spec:
  project: default
  source: {repoURL: https://github.com/ORG/devsecops-order-management-gitops.git,path: environments/production,targetRevision: main}
  destination: {server: https://kubernetes.default.svc,namespace: order-management}
  syncPolicy:
    automated: {prune: true,selfHeal: true,allowEmpty: false}
    syncOptions: [CreateNamespace=true]
