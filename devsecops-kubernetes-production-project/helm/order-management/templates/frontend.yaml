apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "order-management.fullname" . }}-frontend}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.registry }}/frontend:{{ .Values.imageTag }}"
        ports: [{containerPort: 8080}]
        resources: {{ toYaml .Values.resources | nindent 10 }}
        securityContext: {runAsNonRoot: true,allowPrivilegeEscalation: false,capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /,port: 8080},periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec: {selector: {app: frontend},ports: [{port: 8080,targetPort: 8080}]}
