apiVersion: networktestinglab.com.k8s.io/v1
kind: Ingress
metadata: {name: order-management}
spec:
  testinglab.comressClassName: nginx
  rules:
  - host: order-management.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend: {service: {name: {{ include "order-management.fullname" . }}-api-gateway,port: {number: 8000}}}
      - path: /
        pathType: Prefix
        backend: {service: {name: frontend,port: {number: 8080}}}
