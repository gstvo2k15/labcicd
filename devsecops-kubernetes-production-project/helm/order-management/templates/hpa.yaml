{{- if .Values.production }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "order-management.fullname" . }}-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1,kind: Deployment,name: {{ include "order-management.fullname" . }}-api-gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource,resource: {name: cpu,target: {type: Utilization,averageUtilization: 70}}}]
{{- end }}
