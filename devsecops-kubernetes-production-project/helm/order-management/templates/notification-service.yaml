apiVersion: apps/v1
kind: Deployment
metadata: {name: { { include "order-management.fullname" . } }-notification-service}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: RollingUpdate,rollingUpdate: {maxUnavailable: 0,maxSurge: 1}}
  selector: {matchLabels: {app: notification-service}}
  template:
    metadata: {labels: {app: notification-service}}
    spec:
      containers:
      - name: notification-service
        image: "{{ .Values.registry }}/notification-service:{{ .Values.imageTag }}"
        ports: [{{ toYaml (list (dict "containerPort" 8005)) | nindent 8 }}]
        resources: {{ toYaml .Values.resources | nindent 10 }}
        securityContext: {runAsNonRoot: true,allowPrivilegeEscalation: false,capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /ready,port: 8005},periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health,port: 8005},periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: notification-service}
spec: {selector: {app: notification-service},ports: [{port: 8005,targetPort: 8005}]}
