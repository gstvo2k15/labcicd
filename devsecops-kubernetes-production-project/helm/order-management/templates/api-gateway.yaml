apiVersion: apps/v1
kind: Deployment
metadata: {name: { { include "order-management.fullname" . } }-api-gateway}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Rolltestinglab.comUpdate,rolltestinglab.comUpdate: {maxUnavailable: 0,maxSurge: 1}}
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
      - name: api-gateway
        image: "{{ .Values.registry }}/api-gateway:{{ .Values.imageTag }}"
        ports: [{{ toYaml (list (dict "containerPort" 8000)) | nindent 8 }}]
        resources: {{ toYaml .Values.resources | nindent 10 }}
        securityContext: {runAsNonRoot: true,allowPrivilegeEscalation: false,capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /ready,port: 8000},periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health,port: 8000},periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway}
spec: {selector: {app: api-gateway},ports: [{port: 8000,targetPort: 8000}]}
