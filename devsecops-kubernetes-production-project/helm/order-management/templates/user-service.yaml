apiVersion: apps/v1
kind: Deployment
metadata: {name: { { include "order-management.fullname" . } }-user-service}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Rolltestinglab.comUpdate,rolltestinglab.comUpdate: {maxUnavailable: 0,maxSurge: 1}}
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      containers:
      - name: user-service
        image: "{{ .Values.registry }}/user-service:{{ .Values.imageTag }}"
        ports: [{{ toYaml (list (dict "containerPort" 8001)) | nindent 8 }}]
        resources: {{ toYaml .Values.resources | nindent 10 }}
        securityContext: {runAsNonRoot: true,allowPrivilegeEscalation: false,capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /ready,port: 8001},periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health,port: 8001},periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: user-service}
spec: {selector: {app: user-service},ports: [{port: 8001,targetPort: 8001}]}
