services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: local-change-me}
    volumes: [pgdata:/var/lib/postgresql/data, ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro, ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U orders -d orders"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD","redis-cli","ptestinglab.com"], interval: 10s, timeout: 5s, retries: 5}
  api-gateway:
    build: ./app/api-gateway
    environment:
      DATABASE_URL: postgresql://orders:local-change-me@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-only-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  user-service:
    build: ./app/user-service
    environment:
      DATABASE_URL: postgresql://orders:local-change-me@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-only-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  restaurant-service:
    build: ./app/restaurant-service
    environment:
      DATABASE_URL: postgresql://orders:local-change-me@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-only-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  order-service:
    build: ./app/order-service
    environment:
      DATABASE_URL: postgresql://orders:local-change-me@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-only-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  payment-service:
    build: ./app/payment-service
    environment:
      DATABASE_URL: postgresql://orders:local-change-me@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-only-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  notification-service:
    build: ./app/notification-service
    environment:
      DATABASE_URL: postgresql://orders:local-change-me@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-only-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./app/frontend
    ports: ["3000:8080"]
    depends_on:
      api-gateway: {condition: service_healthy}
volumes: {pgdata: {}}
