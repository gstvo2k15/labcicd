trigger:
- main
pr:
- main
pool: {vmImage: ubuntu-latest}
variables:
  ACR_LOGIN_SERVER: 'ACR_NAME.azurecr.io'
  IMAGE_VERSION: '1.0.$(Build.BuildId)'
  FAIL_ON_SEVERITY: 'HIGH,CRITICAL'
stages:
- stage: Validate
  jobs:
  - job: Security
    steps:
    - checkout: self
    - script: python -m pip install --upgrade pip semgrep pip-audit
      displayName: Install Python security tools
    - script: |
        for f in app/*/requirements.txt; do pip-audit -r "$f" --strict; done
      displayName: Dependency scan
    - script: semgrep scan --config security/sast/.semgrep.yml app/
      displayName: SAST
    - script: |
        docker run --rm -v "$(Build.SourcesDirectory):/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact
      displayName: Secret scan
    - script: |
        pip install -r app/user-service/requirements.txt
        python -m pytest app/*/tests -q
      displayName: Unit tests
- stage: BuildScan
  dependsOn: Validate
  jobs:
  - job: Images
    steps:
    - checkout: self
    - script: |
        set -e
        for s in api-gateway user-service restaurant-service order-service payment-service notification-service; do docker build -t $(ACR_LOGIN_SERVER)/order-management/$s:$(Build.SourceVersion) app/$s; done
        docker build -t $(ACR_LOGIN_SERVER)/order-management/frontend:$(Build.SourceVersion) app/frontend
      displayName: Build images
    - script: |
        set -e
        for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '$(ACR_LOGIN_SERVER)/order-management'); do trivy image --severity $(FAIL_ON_SEVERITY) --exit-code 1 "$image"; done
      displayName: Trivy scan
    - script: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $(Agent.ToolsDirectory)/syft
        $(Agent.ToolsDirectory)/syft $(ACR_LOGIN_SERVER)/order-management/api-gateway:$(Build.SourceVersion) -o cyclonedx-json=sbom-api-gateway.json
      displayName: Generate SBOM
    - publish: sbom-api-gateway.json
      artifact: sbom
