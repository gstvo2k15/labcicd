apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: order-service-dev, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/example/platform-gitops.git
    targetRevision: main
    path: environments/dev/order-service
  destination: {server: https://kubernetes.default.svc, namespace: dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
