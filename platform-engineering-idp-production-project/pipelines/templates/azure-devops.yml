trigger:
- main
pool: {vmImage: ubuntu-latest}
steps:
- checkout: self
- task: UsePythonVersion@0
  inputs: {versionSpec: "3.12"}
- script: |
    pip install -r requirements.txt pytest
    pytest -q
  displayName: Tests
- script: docker build -t $(IMAGE_NAME):$(Build.SourceVersion) .
  displayName: Docker build
