apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: monitoring}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols: {grpc: {}, http: {}}
    processors: {batch: {}}
    exporters: {debug: {verbosity: normal}}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
