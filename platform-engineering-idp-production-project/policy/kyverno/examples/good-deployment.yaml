apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-example
  namespace: dev
  labels: {platform.company.io/team: platform-team, platform.company.io/environment: dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: secure-example}}
  template:
    metadata: {labels: {app: secure-example, platform.company.io/team: platform-team, platform.company.io/environment: dev}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: app
          image: nginx:1.27-alpine
          securityContext: {privileged: false, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
