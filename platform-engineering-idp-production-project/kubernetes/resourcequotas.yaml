apiVersion: v1
kind: ResourceQuota
metadata: {name: dev-quota, namespace: dev}
spec:
  hard: {requests.cpu: "4", requests.memory: 8Gi, limits.cpu: "8", limits.memory: 16Gi, pods: "30"}
