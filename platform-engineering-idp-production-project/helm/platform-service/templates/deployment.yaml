apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "platform-service.name" . }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: internal-developer-platform
    app.kubernetes.io/managed-by: Helm
    platform.company.io/team: {{ .Values.labels.team | quote }}
    platform.company.io/environment: {{ .Values.labels.environment | quote }}
    platform.company.io/cost-center: {{ .Values.labels.costCenter | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "platform-service.name" . }}}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports: [{containerPort: 80}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /, port: 80}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /, port: 80}}
          livenessProbe: {httpGet: {path: /, port: 80}}
