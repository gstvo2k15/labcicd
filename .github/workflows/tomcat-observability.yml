name: Tomcat observability checks

on:
  push:
    paths:
      - 'tomcat-observability/**'
      - '.github/workflows/tomcat-observability.yml'
  pull_request:
    paths:
      - 'tomcat-observability/**'
      - '.github/workflows/tomcat-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomcat-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generated Kubernetes configuration is current
        run: python tomcat-observability/kubernetes/render.py --check
      - name: Check shell syntax and Compose configuration
        shell: bash
        run: |
          find tomcat-observability -name '*.sh' -print0 | xargs -0 -n1 bash -n
          cd tomcat-observability/dockercompose
          bash scripts/setup.sh
          docker compose config --quiet
      - name: Check Prometheus configuration and alert rules
        working-directory: tomcat-observability/dockercompose
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/config:/etc/prometheus:ro" prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yaml
          docker run --rm --entrypoint amtool -v "$PWD/config:/config:ro" prom/alertmanager:v0.34.1 check-config /config/alertmanager.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work:ro" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.35.0 /work/tomcat-observability/kubernetes/resources.json

  compose:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tomcat-observability/dockercompose
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Compose lab
        run: |
          bash scripts/setup.sh
          docker compose up -d --build
      - name: HTTP, scrape targets and JMX checks
        run: |
          for attempt in {1..60}; do
            if bash scripts/smoke.sh; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Stop lab
        if: always()
        run: docker compose down

  k3s:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install k3d
        run: |
          curl -fsSL --retry 3 https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 -o /tmp/k3d
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: Build image and create k3s cluster
        run: |
          docker build -t lab/tomcat-alpine-jdk17:10.1.61 tomcat-observability/dockercompose/tomcat
          k3d cluster create tomcat-observability --image rancher/k3s:v1.35.1-k3s1 --wait --timeout 180s
          k3d image import lab/tomcat-alpine-jdk17:10.1.61 -c tomcat-observability
      - name: Kubernetes server validation and deployment
        run: |
          kubectl create namespace tomcat-observability
          kubectl apply --dry-run=server -f tomcat-observability/kubernetes/resources.json
          bash tomcat-observability/kubernetes/deploy.sh
      - name: Check HTTP, metrics, logs, traces and backends
        run: bash tomcat-observability/kubernetes/smoke.sh
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n tomcat-observability get pods,pvc,services
          kubectl -n tomcat-observability describe pods
          kubectl -n tomcat-observability get events --sort-by=.lastTimestamp
          for app in tomcat prometheus alertmanager loki tempo grafana; do
            kubectl -n tomcat-observability logs deployment/"$app" --all-containers --tail=150 || true
          done
      - name: Remove ephemeral cluster
        if: always()
        run: k3d cluster delete tomcat-observability

  security:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkov and Trivy security gates
        working-directory: tomcat-observability/dockercompose
        run: |
          bash scripts/setup.sh
          bash scripts/security.sh --all-images
      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomcat-security-reports
          path: tomcat-observability/dockercompose/reports/*.json
          if-no-files-found: warn
          retention-days: 7

  checks:
    name: Tomcat checks
    if: always()
    needs: [validate, compose, k3s, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success'
