groups:
  - name: availability
    rules:
      - alert: ObservabilityTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Scrape failed: {{ $labels.job }} / {{ $labels.instance }}'
          description: Prometheus has been unable to scrape this target for two minutes.
      - alert: TomcatTelemetryMissing
        expr: absent(jvm_memory_used_bytes{service_name="tomcat"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: Tomcat JVM metrics have been missing for three minutes
          description: Check Tomcat, the OpenTelemetry Java agent, and the Collector metrics pipeline.
