apiVersion: v1
kind: ConfigMap
metadata: {name: food-config, namespace: {{ .Values.namespace }} }
data:
  REDIS_URL: redis://redis:6379/0
  USER_SERVICE_URL: http://user-service:8000
  RESTAURANT_SERVICE_URL: http://restaurant-service:8000
  ORDER_SERVICE_URL: http://order-service:8000
  PAYMENT_SERVICE_URL: http://payment-service:8000
  NOTIFICATION_SERVICE_URL: http://notification-service:8000
---
apiVersion: v1
kind: Secret
metadata: {name: food-secrets, namespace: {{ .Values.namespace }} }
type: Opaque
stringData:
  DATABASE_URL: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.db }}
