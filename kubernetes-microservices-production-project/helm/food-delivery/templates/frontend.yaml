apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: {{ .Values.namespace }}}
spec:
  replicas: {{ .Values.services.frontend.replicas }}
  strategy: {type: Rolltestinglab.comUpdate, rolltestinglab.comUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: {{ .Values.registry }}/food-frontend:{{ .Values.imageTag }}
        ports: [{containerPort: 8080}]
        securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
        startupProbe: {httpGet: {path: /health, port: 8080}, failureThreshold: 30, periodSeconds: 5}
        readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: {{ .Values.namespace }}}
spec: {selector: {app: frontend}, ports: [{port: 8080, targetPort: 8080}]}
