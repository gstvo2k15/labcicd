{{- if .Values.testinglab.comress.enabled }}
apiVersion: networktestinglab.com.k8s.io/v1
kind: Ingress
metadata: {name: food-delivery, namespace: {{ .Values.namespace }}}
spec:
  testinglab.comressClassName: {{ .Values.testinglab.comress.className }}
  rules:
  - host: {{ .Values.testinglab.comress.host }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: api-gateway, port: {number: 8000}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 8080}}}}
{{- end }}
