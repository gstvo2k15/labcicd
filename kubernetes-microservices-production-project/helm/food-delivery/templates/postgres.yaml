apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc, namespace: {{ .Values.namespace }} }
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env: [{name: POSTGRES_DB, value: {{ .Values.postgres.db | quote }}}, {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}, {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
