{{- range $name, $cfg := .Values.services }}
{{- if ne $name "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}, namespace: {{ $.Values.namespace }}}
spec:
  replicas: {{ $cfg.replicas }}
  strategy: {type: Rolltestinglab.comUpdate, rolltestinglab.comUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata: {labels: {app: {{ $name }}}}
    spec:
      containers:
      - name: {{ $name }}
        image: {{ $.Values.registry }}/food-{{ $name }}:{{ $.Values.imageTag }}
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: food-config}}, {secretRef: {name: food-secrets}}]
        securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
        startupProbe: {httpGet: {path: /health, port: 8000}, failureThreshold: 30, periodSeconds: 5}
        readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}, namespace: {{ $.Values.namespace }}}
spec: {selector: {app: {{ $name }}}, ports: [{port: 8000, targetPort: 8000}]}
---
{{- end }}
{{- end }}
