services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: fooddb, POSTGRES_USER: food, POSTGRES_PASSWORD: foodpass}
    volumes: [pgdata:/var/lib/postgresql/data, ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U food -d fooddb'], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  api-gateway:
    build: ./app/api-gateway
    environment: {USER_SERVICE_URL: http://user-service:8000, RESTAURANT_SERVICE_URL: http://restaurant-service:8000, ORDER_SERVICE_URL: http://order-service:8000, PAYMENT_SERVICE_URL: http://payment-service:8000, NOTIFICATION_SERVICE_URL: http://notification-service:8000}
    ports: ['8000:8000']
    depends_on: {user-service: {condition: service_healthy}, restaurant-service: {condition: service_healthy}}
  user-service: &svc
    build: ./app/user-service
    environment: {DATABASE_URL: postgresql://food:foodpass@postgres:5432/fooddb, REDIS_URL: redis://redis:6379/0, SERVICE_NAME: user-service}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  restaurant-service:
    build: ./app/restaurant-service
    environment: {DATABASE_URL: postgresql://food:foodpass@postgres:5432/fooddb, REDIS_URL: redis://redis:6379/0, SERVICE_NAME: restaurant-service}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  order-service:
    build: ./app/order-service
    environment: {DATABASE_URL: postgresql://food:foodpass@postgres:5432/fooddb, REDIS_URL: redis://redis:6379/0, SERVICE_NAME: order-service}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  payment-service:
    build: ./app/payment-service
    environment: {DATABASE_URL: postgresql://food:foodpass@postgres:5432/fooddb, REDIS_URL: redis://redis:6379/0, SERVICE_NAME: payment-service}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  notification-service:
    build: ./app/notification-service
    environment: {DATABASE_URL: postgresql://food:foodpass@postgres:5432/fooddb, REDIS_URL: redis://redis:6379/0, SERVICE_NAME: notification-service}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  frontend:
    build: ./app/frontend
    ports: ['8080:8080']
    depends_on: {api-gateway: {condition: service_started}}
volumes: {pgdata: {}}
