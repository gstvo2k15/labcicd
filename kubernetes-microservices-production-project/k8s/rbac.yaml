apiVersion: v1
kind: ServiceAccount
metadata: {name: food-app, namespace: food-delivery}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: food-read, namespace: food-delivery}
rules:
- apiGroups: [""]
  resources: [pods,services,configmaps]
  verbs: [get,list,watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBindtestinglab.com
metadata: {name: food-read, namespace: food-delivery}
subjects: [{kind: ServiceAccount, name: food-app, namespace: food-delivery}]
roleRef: {kind: Role, name: food-read, apiGroup: rbac.authorization.k8s.io}
