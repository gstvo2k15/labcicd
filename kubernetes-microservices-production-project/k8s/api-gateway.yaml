apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: food-delivery}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      serviceAccountName: food-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: api-gateway}}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api-gateway
        image: YOUR_ACR.azurecr.io/food-api-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: food-config}
        - secretRef: {name: food-secrets}
        env:
        - {name: USER_SERVICE_URL, valueFrom: {configMapKeyRef: {name: food-config, key: USER_SERVICE_URL}}}
        - {name: RESTAURANT_SERVICE_URL, valueFrom: {configMapKeyRef: {name: food-config, key: RESTAURANT_SERVICE_URL}}}
        - {name: ORDER_SERVICE_URL, valueFrom: {configMapKeyRef: {name: food-config, key: ORDER_SERVICE_URL}}}
        - {name: PAYMENT_SERVICE_URL, valueFrom: {configMapKeyRef: {name: food-config, key: PAYMENT_SERVICE_URL}}}
        - {name: NOTIFICATION_SERVICE_URL, valueFrom: {configMapKeyRef: {name: food-config, key: NOTIFICATION_SERVICE_URL}}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
        startupProbe: {httpGet: {path: /health, port: 8000}, failureThreshold: 30, periodSeconds: 5}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: food-delivery}
spec: {selector: {app: api-gateway}, ports: [{port: 8000, targetPort: 8000}]}
