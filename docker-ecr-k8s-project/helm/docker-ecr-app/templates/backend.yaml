apiVersion: v1
kind: Service
metadata: { name: backend, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: backend }
  ports: [{ port: {{ .Values.backend.port }}, targetPort: {{ .Values.backend.port }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: {{ .Values.namespace }} }
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy: { type: Rolltestinglab.comUpdate, rolltestinglab.comUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      imagePullSecrets: [{ name: {{ .Values.imagePullSecret }} }]
      containers:
        - name: backend
          image: "{{ .Values.registry }}/{{ .Values.backend.repository }}:{{ .Values.backend.tag }}"
          ports: [{ containerPort: {{ .Values.backend.port }} }]
          env:
            - name: APP_ENV
              value: production
            - name: APP_VERSION
              value: "{{ .Values.backend.tag }}"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
          readinessProbe: { httpGet: { path: /ready, port: 8000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources.backend | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001, readOnlyRootFilesystem: true }
