apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: {{ .Values.frontend.port }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: {{ .Values.namespace }} }
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      imagePullSecrets: [{ name: {{ .Values.imagePullSecret }} }]
      containers:
        - name: frontend
          image: "{{ .Values.registry }}/{{ .Values.frontend.repository }}:{{ .Values.frontend.tag }}"
          ports: [{ containerPort: {{ .Values.frontend.port }} }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
