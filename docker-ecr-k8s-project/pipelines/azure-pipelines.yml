trigger:
  branches: { include: [main] }

variables:
  AWS_REGION: 'us-east-1'
  ECR_REPO_PREFIX: 'k8s-docker-ecr'
  VERSION: '1.0.$(Build.BuildId)'

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  fetchDepth: 0

- task: Bash@3
  displayName: 'Verify toolchain'
  inputs:
    targetType: inline
    script: |
      set -eux
      docker --version
      aws --version
      git --version
      python3 --version

- task: Bash@3
  displayName: 'Set image variables'
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
  inputs:
    targetType: inline
    script: |
      set -euo pipefail
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      SHA=$(git rev-parse --short=12 HEAD)
      REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      echo "##vso[task.setvariable variable=REGISTRY]$REGISTRY"
      echo "##vso[task.setvariable variable=GIT_SHA]$SHA"

- task: Bash@3
  displayName: 'Login to Amazon ECR'
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
  inputs:
    targetType: inline
    script: |
      set -euo pipefail
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

- task: Bash@3
  displayName: 'Build images'
  inputs:
    targetType: inline
    script: |
      set -euo pipefail
      docker build --pull -f app/backend/Dockerfile -t "$REGISTRY/$ECR_REPO_PREFIX/backend:$VERSION" app/backend
      docker build --pull -f app/frontend/Dockerfile -t "$REGISTRY/$ECR_REPO_PREFIX/frontend:$VERSION" app/frontend
      docker tag "$REGISTRY/$ECR_REPO_PREFIX/backend:$VERSION" "$REGISTRY/$ECR_REPO_PREFIX/backend:sha-$GIT_SHA"
      docker tag "$REGISTRY/$ECR_REPO_PREFIX/frontend:$VERSION" "$REGISTRY/$ECR_REPO_PREFIX/frontend:sha-$GIT_SHA"

- task: Bash@3
  displayName: 'Security scan with Trivy'
  inputs:
    targetType: inline
    script: |
      set -euo pipefail
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL "$REGISTRY/$ECR_REPO_PREFIX/backend:$VERSION"
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL "$REGISTRY/$ECR_REPO_PREFIX/frontend:$VERSION"

- task: Bash@3
  displayName: 'Push version and commit-SHA tags'
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
  inputs:
    targetType: inline
    script: |
      set -euo pipefail
      docker push "$REGISTRY/$ECR_REPO_PREFIX/backend:$VERSION"
      docker push "$REGISTRY/$ECR_REPO_PREFIX/backend:sha-$GIT_SHA"
      docker push "$REGISTRY/$ECR_REPO_PREFIX/frontend:$VERSION"
      docker push "$REGISTRY/$ECR_REPO_PREFIX/frontend:sha-$GIT_SHA"

# Recommended production promotion step:
# Deploy only an immutable sha-* tag to AKS after ECR scanntestinglab.com/policy approval.
