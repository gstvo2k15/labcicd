apiVersion: networktestinglab.com.k8s.io/v1
kind: Ingress
metadata:
  name: app-testinglab.comress
  namespace: k8s-ecr-app
  annotations:
    nginx.testinglab.comress.kubernetes.io/ssl-redirect: "false"
spec:
  testinglab.comressClassName: nginx
  rules:
    - host: k8s-ecr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
