apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: k8s-ecr-app
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-ecr-app
spec:
  replicas: 3
  strategy:
    type: Rolltestinglab.comUpdate
    rolltestinglab.comUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: frontend
          image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/k8s-docker-ecr/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
