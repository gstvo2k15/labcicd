{{- range $name, $port := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{$name}}
  namespace: {{$.Values.namespace}}
spec:
  replicas: {{$.Values.replicas}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: {{$name}}}
  template:
    metadata:
      labels: {app: {{$name}}}
    spec:
      serviceAccountName: order-app
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{$name}}
          image: "{{$.Values.registry}}/{{$name}}:{{$.Values.tag}}"
          ports: [{containerPort: {{$port}}}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          startupProbe: {httpGet: {path: /health, port: {{$port}}}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /ready, port: {{$port}}}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: {{$port}}}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: {{$name}}, namespace: {{$.Values.namespace}}}
spec:
  selector: {app: {{$name}}}
  ports: [{port: {{$port}}, targetPort: {{$port}}}]
{{- end }}
