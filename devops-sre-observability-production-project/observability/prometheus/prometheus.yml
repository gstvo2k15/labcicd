global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: api-gateway
    static_configs: [{targets: ["api-gateway:8000"]}]
  - job_name: user-service
    static_configs: [{targets: ["user-service:8001"]}]
  - job_name: restaurant-service
    static_configs: [{targets: ["restaurant-service:8002"]}]
  - job_name: order-service
    static_configs: [{targets: ["order-service:8003"]}]
  - job_name: payment-service
    static_configs: [{targets: ["payment-service:8004"]}]
  - job_name: notification-service
    static_configs: [{targets: ["notification-service:8005"]}]
