apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: order-app-read
  namespace: order-sre
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBindtestinglab.com
metadata:
  name: order-app-read
  namespace: order-sre
subjects:
  - kind: ServiceAccount
    name: order-app
roleRef:
  kind: Role
  name: order-app-read
  apiGroup: rbac.authorization.k8s.io
