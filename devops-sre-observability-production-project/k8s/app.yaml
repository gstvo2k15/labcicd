---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: order-sre
spec:
  replicas: 2
  strategy:
    type: Rolltestinglab.comUpdate
    rolltestinglab.comUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: order-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: REPLACE_ACR/order-management/api-gateway:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: order-sre-config
          env:
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: DATABASE_URL
              value: "postgresql://orders:change-me-demo@postgres:5432/order_management"
            - name: JWT_SECRET
              value: "replace-with-secret-manager"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: order-sre
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000

