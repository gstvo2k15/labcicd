apiVersion: networktestinglab.com.k8s.io/v1
kind: Ingress
metadata:
  name: order-sre
  namespace: order-sre
spec:
  rules:
    - host: order-sre.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: {number: 8000}
